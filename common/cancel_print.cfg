[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    STATUS_BUSY
    STOP_PRINT_MONITOR
    M400                           ; wait for moves to finish
    G92 E0
    G1 E-3 F300                    ; retract
    # Turn off extruder only -- bed stays hot for quick restarts.
    # Idle timeout (30 min) handles full heater shutdown if you walk away.
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    M107                           ; part fan off

    # Raise Z by 100mm, clamped so we never exceed Z=300
    {% set z_now = printer.toolhead.position.z %}
    {% set z_target = [z_now + 100, 300] | min %}
    {% set z_lift = z_target - z_now %}
    {% if z_lift > 0 %}
        G91
        G0 Z{z_lift} F3600
        G90
    {% endif %}

    G0 X175 Y350 F6000            ; park at rear
    CLEAR_PAUSE
    # NOTE: BED_MESH_CLEAR and M84 removed intentionally.
    # PRINT_START re-meshes adaptively each time. Idle timeout
    # handles stepper disable. Preserves homing + QGL + bed temp
    # for quick restarts.
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT
    _SET_CASE_LEDS PRESET=7
    UPDATE_DELAYED_GCODE ID=_case_leds_complete_to_idle DURATION=900
