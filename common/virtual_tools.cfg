# Virtual tool macros for multi-colour printing with a single extruder.
# PrusaSlicer generates Tn commands when switching between virtual
# extruders. These macros absorb those commands so Klipper does not
# error with "Unknown command" or "Extruder not configured".

[gcode_macro T0]
gcode:
    # Virtual tool 0 - single extruder, no action required

[gcode_macro T1]
gcode:
    # Virtual tool 1 - single extruder, no action required

[gcode_macro T2]
gcode:
    # Virtual tool 2 - single extruder, no action required

[gcode_macro T3]
gcode:
    # Virtual tool 3 - single extruder, no action required

[gcode_macro T4]
gcode:
    # Virtual tool 4 - single extruder, no action required

[gcode_macro T5]
gcode:
    # Virtual tool 5 - single extruder, no action required

[gcode_macro T6]
gcode:
    # Virtual tool 6 - single extruder, no action required

[gcode_macro T7]
gcode:
    # Virtual tool 7 - single extruder, no action required

[gcode_macro T8]
gcode:
    # Virtual tool 8 - single extruder, no action required

[gcode_macro T9]
gcode:
    # Virtual tool 9 - single extruder, no action required
